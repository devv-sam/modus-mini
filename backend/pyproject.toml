[project]
name = "modus-mini"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "pandas",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
